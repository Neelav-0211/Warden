[project]
name = "warden-common"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
	"alembic>=1.14,<2",
	"asyncpg>=0.30,<1",
	"opentelemetry-exporter-otlp-proto-http>=1.27,<2",
	"opentelemetry-sdk>=1.27,<2",
	"pydantic-settings>=2.5,<3",
	"pyyaml>=6,<7",
	"sqlalchemy[asyncio]>=2.0,<3",
	"structlog>=24.4,<26",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/common"]
