[project]
name = "warden-model-gateway"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
	"jsonschema>=4.23,<5",
	"warden-common",
]

[tool.uv]

[tool.uv.sources]
warden-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core/model_gateway"]
